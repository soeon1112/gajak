<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gajak | 가작</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0a0a0f;
            color: #e8e6e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(88, 78, 120, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(58, 90, 120, 0.08) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, 1%); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem;
        }

        .logo-mark {
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(232, 230, 225, 0.35);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #e8e6e1 0%, #a8a5a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            font-weight: 300;
            color: rgba(232, 230, 225, 0.5);
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(232, 230, 225, 0.15);
            margin: 0 auto 2.5rem;
        }

        .description {
            font-size: 0.9rem;
            line-height: 1.8;
            color: rgba(232, 230, 225, 0.4);
            font-weight: 300;
            max-width: 360px;
            margin: 0 auto 3rem;
        }

        .contact {
            font-size: 0.8rem;
            color: rgba(232, 230, 225, 0.25);
            letter-spacing: 0.05em;
        }

        .contact a {
            color: rgba(232, 230, 225, 0.35);
            text-decoration: none;
            border-bottom: 1px solid rgba(232, 230, 225, 0.1);
            transition: all 0.3s ease;
        }

        .contact a:hover {
            color: rgba(232, 230, 225, 0.6);
            border-bottom-color: rgba(232, 230, 225, 0.3);
        }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }
        .fade-in:nth-child(3) { animation-delay: 0.6s; }
        .fade-in:nth-child(4) { animation-delay: 0.8s; }
        .fade-in:nth-child(5) { animation-delay: 1.0s; }
        .fade-in:nth-child(6) { animation-delay: 1.2s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="logo-mark fade-in">Mobile App Development</p>
        <h1 class="fade-in">가작</h1>
        <p class="subtitle fade-in">Gajak</p>
        <div class="divider fade-in"></div>
        <p class="description fade-in">
            모바일 애플리케이션을 개발하고 있습니다.
        </p>
        <p class="contact fade-in">
            <a href="mailto:eonsom2@gajak.kr">eonsom2@gajak.kr</a>
        </p>
    </div>
</body>
</html>
